<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Quant Hub - 매매 타점 대시보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center font-black text-lg">Q</div>
                <h1 class="text-base font-bold tracking-tight">AI QUANT HUB</h1>
            </div>

            <!-- Mode Switch -->
            <div class="bg-slate-950 p-1 rounded-xl border border-slate-800 flex items-center gap-1">
                <button id="btn-simple" onclick="setMode('simple')" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-indigo-600 text-white transition">
                    ✨ 간편 모드
                </button>
                <button id="btn-pro" onclick="setMode('pro')" class="px-3 py-1.5 rounded-lg text-xs font-bold text-slate-400 hover:text-white transition">
                    📊 전문가(Pro) 모드
                </button>
            </div>
        </div>
    </header>

    <!-- Pro Market Bar -->
    <div id="pro-market-bar" class="hidden bg-slate-900/80 border-b border-slate-800 text-xs py-2 px-4 overflow-x-auto whitespace-nowrap">
        <div class="max-w-7xl mx-auto flex items-center justify-between gap-6 text-slate-400">
            <div class="flex items-center gap-4">
                <span class="bg-indigo-500/20 text-indigo-400 font-bold px-2 py-0.5 rounded text-[10px]">PRO MACRO</span>
                <div>시장 상태: <span id="market-status" class="font-bold text-emerald-400">로딩 중...</span></div>
            </div>
            <div>알고리즘 적중률(승률): <span class="text-emerald-400 font-bold">56.0%</span> | 손익비: <span class="text-emerald-400 font-bold">2.40</span></div>
        </div>
    </div>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">

        <!-- Top Pick Section -->
        <section class="bg-gradient-to-br from-slate-900 via-slate-900 to-indigo-950/40 p-6 rounded-2xl border border-indigo-500/30 shadow-2xl">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 items-center">
                <div class="lg:col-span-2 space-y-3">
                    <div class="flex items-center gap-2">
                        <span class="bg-emerald-500 text-slate-950 text-xs font-black px-2.5 py-0.5 rounded-full">TODAY'S AI TOP PICK</span>
                        <span class="text-slate-400 text-xs">5팩터 다층 알고리즘 검증 완료</span>
                    </div>
                    <h2 class="text-3xl font-black tracking-tight" id="top-name">
                        로딩 중...
                    </h2>
                    <p class="text-emerald-400 text-sm font-semibold">
                        💡 "상승 추세 유지 + 변동성 상단 돌파 & 거래량 수급 유입 포착"
                    </p>
                </div>

                <div class="bg-slate-900/90 p-5 rounded-xl border border-slate-800 text-center space-y-3">
                    <div>
                        <div class="text-xs text-slate-400 font-medium">AI 승률 스코어</div>
                        <div class="text-5xl font-black text-emerald-400 mt-1" id="top-score">0 <span class="text-sm text-slate-500 font-normal">/ 100점</span></div>
                    </div>
                    
                    <div class="grid grid-cols-3 gap-2 pt-2 border-t border
